# Check the download links in your secrets before a long build.
# Runs on a free Linux runner in about 1 minute and downloads nothing big.
#
# Launch: Actions tab > "Check links" > Run workflow

name: Check links

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check the 3 links
        env:
          KEYS_URL: ${{ secrets.KEYS_URL }}
          BASE_URL: ${{ secrets.BASE_URL }}
          UPDATE_URL: ${{ secrets.UPDATE_URL }}
        shell: python3 {0}
        run: |
          import os, re, sys, urllib.request, urllib.parse

          def extract_drive_id(url):
              if "/folders/" in url:
                  return None
              m = re.search(r"/file/d/([\w-]+)", url) or re.search(r"[?&]id=([\w-]+)", url)
              return m.group(1) if m else None

          def probe(url):
              fid = extract_drive_id(url)
              if fid:
                  # Traitement spécifique Google Drive
                  target_url = f"https://drive.usercontent.google.com/download?id={fid}&export=download&confirm=t"
              else:
                  # Traitement pour les URL standard non-Drive
                  target_url = url

              req = urllib.request.Request(target_url, headers={
                  "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
              })

              r = urllib.request.urlopen(req, timeout=60)
              head = r.read(4096)
              
              # Nom du fichier depuis le header Content-Disposition ou l'URL
              cd_names = re.findall(r'filename\*?=(?:UTF-8\'\')?"?([^";]+)"?', r.headers.get("Content-Disposition", ""))
              if cd_names:
                  filename = cd_names[0]
              else:
                  filename = os.path.basename(urllib.parse.urlparse(url).path) or "?"

              info = {
                  "type": r.headers.get("Content-Type", ""),
                  "size": int(r.headers.get("Content-Length") or 0),
                  "name": filename,
                  "head": head,
                  "is_drive": fid is not None
              }
              r.close()
              return info

          ok = True
          targets = [
              ("prod.keys", "KEYS_URL", 1), 
              ("base game", "BASE_URL", 1 << 30), 
              ("update", "UPDATE_URL", 1 << 20)
          ]

          for label, var, min_size in targets:
              url = os.environ.get(var, "").strip()
              print(f"\n== {label} ({var})")
              if not url:
                  print("  FAIL: secret is empty or missing"); ok = False; continue

              try:
                  i = probe(url)
              except Exception as e:
                  print(f"  FAIL: link verification failed ({e}). Check permissions or link availability."); ok = False; continue

              if "text/html" in i["type"] or i["head"].lstrip().lower().startswith((b"<!doctype", b"<html")):
                  print("  FAIL: The URL returned an HTML web page instead of a direct file. Ensure the URL is a direct download link.")
                  ok = False; continue

              name = i["name"]
              size = i["size"]
              print(f"  file: {name}, {size / 1e9:.2f} GB" if size else f"  file: {name}, size unknown")

              if label == "prod.keys":
                  lines = i["head"].decode("utf-8", "replace").splitlines()
                  if not any(re.match(r"^\s*\w+\s*=\s*[0-9a-fA-F]{16,}", l) for l in lines):
                      print("  FAIL: this does not look like a valid prod.keys file"); ok = False; continue
              elif size and size < min_size:
                  print(f"  FAIL: file is too small for {label}"); ok = False; continue

              print("  OK")

          print("\nAll good, you can run 'Build Mush8 IPA'." if ok else "\nFix the FAIL lines, then run this check again.")
          sys.exit(0 if ok else 1)
