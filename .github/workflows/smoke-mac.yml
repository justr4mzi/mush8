# Run the game for a few minutes on a GitHub Mac with scripted input (A pressed
# every second: menus -> Grand Prix -> race), once per setting in `modes`, and
# publish the text logs (fps, timings, errors) to the ci-logs branch.
# Only text goes out: screenshots stay on the runner and are summarised as
# numbers (how much of the screen is not black).
name: Mac smoke test

on:
  workflow_dispatch:
    inputs:
      runner:
        description: "macOS runner label"
        default: "macos-15"
      modes:
        description: "space separated NX_ASYNC_GFX values to run (one run each)"
        default: "0 1"
      seconds:
        description: "seconds per run"
        default: "200"
      script:
        description: "NX_AUTOINPUT script (time:BUTTON,...); empty = A every second"
        default: ""
      record:
        description: "1 = start each run with an empty pipeline list and publish what it records"
        default: "0"
      monkey:
        description: "1 = random play (tools/monkey.py, a new seed each run) instead of A every second"
        default: "0"
      vs96:
        description: "1 = VS race, all tracks in order (tools/vs96.py)"
        default: "0"

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ${{ inputs.runner || 'macos-15' }}
    timeout-minutes: 360
    steps:
      - name: Use the newest Xcode
        run: |
          X="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          sudo xcode-select -s "$X/Contents/Developer"; xcodebuild -version; sysctl hw.memsize hw.ncpu

      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          brew install sevenzip > /dev/null || true

      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Cache game modules
        uses: actions/cache@v4
        with:
          path: work/v-upd
          key: modules-${{ hashFiles('crates/nxpatch/**', 'crates/nxfs/**') }}
          restore-keys: modules-

      - name: Download game files
        env:
          KEYS_URL: ${{ secrets.KEYS_URL }}
          BASE_URL: ${{ secrets.BASE_URL }}
          UPDATE_URL: ${{ secrets.UPDATE_URL }}
          GDRIVE_SA_JSON: ${{ secrets.GDRIVE_SA_JSON }}
          FIRMWARE_URL: ${{ secrets.FIRMWARE_URL }}
          DLC_URL: ${{ secrets.DLC_URL }}
        run: |
          mkdir -p out; exec > >(python3 -u .github/mask.py | tee -a out/download.txt) 2>&1
          python3 -m pip install --quiet --break-system-packages gdown pillow google-auth requests || python3 -m pip install --quiet --user gdown pillow google-auth requests
          export PATH="$PATH:$(python3 -m site --user-base)/bin"
          get() {
            case "$1" in
              *drive.google.com*)
                if [ -n "${GDRIVE_SA_JSON:-}" ]; then
                  id="$(python3 .github/drive_token.py --id "$1")"; tok="$(python3 .github/drive_token.py)"
                  curl -fsSL --retry 5 --retry-all-errors -C - -H "Authorization: Bearer $tok" \
                    "https://www.googleapis.com/drive/v3/files/$id?alt=media&supportsAllDrives=true&acknowledgeAbuse=true" -o "$2" && return 0
                  echo "Drive API download failed, trying the public link"
                fi
                for i in 1 2 3 4 5; do
                  python3 -m gdown --continue --retries 3 --quiet "$1" -O "$2" && return 0
                  echo "Drive download cut, retry $i"; sleep 10
                done; return 1 ;;
              *dropbox.com*)
                u="${1/dl=0/dl=1}"; case "$u" in *dl=1*) ;; *\?*) u="$u&dl=1" ;; *) u="$u?dl=1" ;; esac
                curl -fsSL --retry 5 --retry-all-errors -C - "$u" -o "$2" ;;
              *) curl -fsSL --retry 3 "$1" -o "$2" ;;
            esac
          }
          get "$KEYS_URL"   prod.keys
          get "$BASE_URL"   base.nsp
          get "$UPDATE_URL" upd4-0-1.nsp
          # optional: Booster Course Pass (secret DLC_URL), loaded from ./dlc.nsp
          if [ -n "$DLC_URL" ]; then get "$DLC_URL" dlc.nsp && ls -lh dlc.nsp; fi
          ls -lh prod.keys base.nsp upd4-0-1.nsp
          # The game needs the console's system files (Mii, fonts): secret
          # FIRMWARE_URL = link to a zip of your own Firmware folder (.nca files)
          [ -n "$FIRMWARE_URL" ] || { echo "::error::Secret FIRMWARE_URL is missing: the game stops at boot without the Firmware folder"; exit 1; }
          get "$FIRMWARE_URL" firmware.archive
          mkdir -p fw-tmp && tar -xf firmware.archive -C fw-tmp && rm -f firmware.archive
          nca="$(find fw-tmp -name '*.nca' | head -1)"
          [ -n "$nca" ] || { echo "::error::no .nca file in the firmware archive"; exit 1; }
          rm -rf Firmware && mv "$(dirname "$nca")" Firmware && rm -rf fw-tmp
          echo "Firmware: $(ls Firmware | wc -l) files"

      - name: Save (secret SAVE_URL; a fresh save stops at the Mii editor)
        env:
          SAVE_URL: ${{ secrets.SAVE_URL }}
          GDRIVE_SA_JSON: ${{ secrets.GDRIVE_SA_JSON }}
        run: |
          rm -rf smoke-save
          [ -n "$SAVE_URL" ] || { echo "::warning::no SAVE_URL: a fresh save stops at the Mii editor"; exit 0; }
          mkdir -p out; exec > >(python3 -u .github/mask.py | tee -a out/download.txt) 2>&1
          export PATH="$PATH:$(python3 -m site --user-base)/bin"
          case "$SAVE_URL" in
            *drive.google.com*)
              if [ -n "${GDRIVE_SA_JSON:-}" ]; then
                id="$(python3 .github/drive_token.py --id "$SAVE_URL")"; tok="$(python3 .github/drive_token.py)"
                curl -fsSL --retry 5 -H "Authorization: Bearer $tok" "https://www.googleapis.com/drive/v3/files/$id?alt=media&supportsAllDrives=true&acknowledgeAbuse=true" -o save.archive \
                  || python3 -m gdown --quiet "$SAVE_URL" -O save.archive
              else
                python3 -m gdown --quiet "$SAVE_URL" -O save.archive
              fi ;;
            *dropbox.com*) u="${SAVE_URL/dl=0/dl=1}"; curl -fsSL "$u" -o save.archive ;;
            *) curl -fsSL "$SAVE_URL" -o save.archive ;;
          esac
          mkdir -p save-tmp
          if ! tar -xf save.archive -C save-tmp 2>/dev/null || [ -z "$(find save-tmp -type f -size +0)" ]; then
            rm -rf save-tmp; mkdir -p save-tmp
            brew install unar > /dev/null && unar -q -f -o save-tmp save.archive
          fi
          rm -f save.archive
          d=save-tmp; while [ "$(ls -A "$d" | wc -l)" -eq 1 ] && [ -d "$d/$(ls -A "$d")" ]; do d="$d/$(ls -A "$d")"; done
          mv "$d" smoke-save; rm -rf save-tmp
          find smoke-save -type f | wc -l

      - name: Apply patches and build (macOS)
        run: |
          mkdir -p out; exec > >(tee -a out/build.txt) 2>&1
          python3 patch-heap.py
          cargo build --release
          [ -f work/v-upd/exefs/main ] || ./target/release/nxfs extract --base base.nsp --update upd4-0-1.nsp --out work/v-upd
          P=work/v-upd/patched
          [ "$(cat "$P/nxpatch.stamp" 2>/dev/null)" = "$(./target/release/nxpatch stamp)" ] || ./target/release/nxpatch rewrite --out "$P" \
            work/v-upd/exefs/main work/v-upd/exefs/subsdk0 work/v-upd/exefs/sdk

      - name: Run
        env:
          MODES: ${{ inputs.modes || '0 1' }}
          SECS: ${{ inputs.seconds || '200' }}
          SCRIPT: ${{ inputs.script }}
          RECORD: ${{ inputs.record || '0' }}
          MONKEY: ${{ inputs.monkey || '0' }}
          VS96: ${{ inputs.vs96 || '0' }}
          GH_TOKEN: ${{ github.token }}
          IPA_PASSWORD: ${{ secrets.IPA_PASSWORD }}
        run: |
          mkdir -p out
          INPUT="${SCRIPT:-$(python3 -c "print(','.join(f'{t}:A' for t in range(12, int('$SECS'))))")}"
          DUMPS="$(python3 -c "print(','.join(str(t) for t in range(20, int('$SECS'), 20)))")"
          n=0
          for m in $MODES; do
            n=$((n+1)); L="out/run-$n-async$m.log"
            rm -rf work/frame work/save
            [ "$RECORD" = 1 ] && rm -f work/pipelines.tsv
            [ "$MONKEY" = 1 ] && INPUT="$(python3 tools/monkey.py "$n$GITHUB_RUN_ID" "$SECS")"
            [ "$VS96" = 1 ] && INPUT="$(python3 tools/vs96.py "$SECS")"
            mkdir -p work/save
            if [ -d smoke-save ]; then
              if ls -d smoke-save/type* >/dev/null 2>&1; then cp -R smoke-save/. work/save/; else mkdir -p work/save/type1-index0 && cp -R smoke-save/. work/save/type1-index0/; fi
            fi
            LIST=data/pipelines.tsv; [ "$RECORD" = 1 ] && LIST=/nonexistent
            echo "=== run $n: NX_ASYNC_GFX=$m ($SECS s)"
            NX_ASYNC_GFX=$m NX_FPS=1 NX_FRAMESKIP=1 NX_HASH_EVERY=2 NX_HANDHELD=1 NX_TRACE_ROMFS=1 NX_PIPELINE_LIST="$LIST" \
              NX_AUTOINPUT="$INPUT" NX_DUMP_AT="$DUMPS" ./target/release/nxhost > "$L" 2>&1 &
            pid=$!
            # every 10 min: a short progress file on the ci-logs branch (tracks loaded, fps, end of the log)
            live() {
              { echo "run $n, $(date -u +%H:%M) UTC, $(( $(date +%s) - T0 )) s"
                echo "tracks:"; grep -E "^\[romfs\] [0-9.]+ s (dlc:)?/Course/[^/]+/course_model" "$L" | awk '{print $2"s", $4}' | sed -E 's#/course_model.*##'
                echo "last game files read:"; grep -E "^\[romfs\] [0-9.]+ s " "$L" | tail -25 | awk '{print $2"s", $4}'
                grep "^\[fps\]" "$L" | tail -60 | awk '{s+=$2;n++} END{if(n) printf "game fps (last minute): %.1f\n", s/n}'
                grep -E "\[mem\]|\[hang\] no frame|panic|abort" "$L" | tail -5
                echo "--- end of the log"; grep -vE "^\[(fps|prof|hang)\]" "$L" | tail -15 | cut -c1-200
                [ -f work/pipelines.tsv ] && echo "new pipelines so far: $(wc -l < work/pipelines.tsv)"
              } > "out/live-$n.txt" 2>/dev/null
              # only the small progress file goes out now, the full log at the end; plus the last
              # 6 screenshots, small JPEGs in a zip encrypted with the IPA password (repo is public)
              ( D="$RUNNER_TEMP/live"; rm -rf "$D"; mkdir -p "$D/out" "$D/shots"; cp "out/live-$n.txt" "$D/out/"
                if [ -n "${IPA_PASSWORD:-}" ] && command -v 7zz >/dev/null; then
                  for f in $(ls -t work/frame/t*.png 2>/dev/null | head -6); do
                    python3 -c "import sys; from PIL import Image; Image.open(sys.argv[1]).convert('RGB').resize((640,360)).save(sys.argv[2], quality=70)" "$f" "$D/shots/$(basename "$f" .png).jpg"
                  done
                  [ -n "$(ls "$D/shots")" ] && 7zz a -tzip -mem=AES256 -p"$IPA_PASSWORD" "$D/out/screens-$n.zip" "$D/shots/"* > /dev/null
                fi
                cd "$D" && bash "$GITHUB_WORKSPACE/.github/publish-logs.sh" smoke ) > /dev/null 2>&1 || true
            }
            T0=$(date +%s)
            for i in $(seq 1 "$SECS"); do sleep 1; kill -0 $pid 2>/dev/null || break; [ $((i % 600)) = 0 ] && live; done
            live
            if kill -0 $pid 2>/dev/null; then echo "still running after $SECS s: stopping it"; kill $pid; sleep 3; kill -9 $pid 2>/dev/null || true; else wait $pid && echo "exited by itself" || echo "exited by itself with code $?"; fi
            grep -c "^\[fps\]" "$L" || true
            [ -f work/pipelines.tsv ] && cp work/pipelines.tsv "out/pipelines-$n.tsv" && wc -l "out/pipelines-$n.tsv"
            python3 - <<'EOF' | tee -a "$L"
          import glob
          from PIL import Image
          for f in sorted(glob.glob("work/frame/t*.png")):
              im = Image.open(f).convert("L").resize((160, 90))
              px = list(im.getdata())
              lit = sum(p > 16 for p in px) / len(px)
              print(f"[smoke] screen {f.split('/')[-1]}: {lit*100:.0f}% not black, mean {sum(px)/len(px):.0f}")
          EOF
            tail -3 "$L"
          done

      - name: Keep the pipelines recorded so far (also when the job is stopped)
        if: always()
        run: |
          mkdir -p out
          [ -f work/pipelines.tsv ] && cp work/pipelines.tsv out/pipelines-final.tsv && wc -l out/pipelines-final.tsv || true

      - name: Remove game files
        if: always()
        run: rm -rf prod.keys base.nsp upd4-0-1.nsp dlc.nsp Firmware fw-tmp work/frame smoke-save work/save

      - name: Publish logs
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/publish-logs.sh smoke
