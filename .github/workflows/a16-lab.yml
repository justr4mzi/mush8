# Test bench for the A16 pipeline archive. Needs no game files: it reuses the
# iOS shader cache the last "Build Mush8 IPA" run saved. Prints logs only
# (nothing game-derived is uploaded, the repo is public).
#
# Launch: Actions tab > "A16 lab" > Run workflow (limit 0 = all pipelines)

name: A16 lab

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "how many pipelines to translate (0 = all)"
        default: "40"

permissions:
  contents: write

jobs:
  lab:
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Tools
        run: |
          mkdir -p out; exec > >(tee -a out/tools.txt) 2>&1
          xcodebuild -version
          ls -d /Applications/Xcode*.app
          xcrun -sdk iphoneos -f metal-tt || true
          xcrun -sdk iphoneos metal-tt --help 2>&1 | head -60 || true
          TC="$(dirname "$(dirname "$(xcrun -sdk iphoneos -f metal-tt)")")"
          echo "toolchain: $TC"
          find "$TC" -iname '*pipeline*' 2>/dev/null | head -20
          find "$TC" -path '*man*' -iname '*metal*' 2>/dev/null | head -40
          M="$(find "$TC" -iname 'metal-pipelines-script*' 2>/dev/null | head -1)"
          [ -n "$M" ] && (mandoc -T utf8 "$M" 2>/dev/null || man "$M" 2>/dev/null || cat "$M") | col -b > out/pipelines-script.txt
          wc -l out/pipelines-script.txt || true
          xcrun -sdk iphoneos metal-tt 2>&1 | head -40 || true
          for m in metal-tt metal-strip metal-lipo metal-pack metal-nt; do
            f="$(find "$TC" -name "$m.1" | head -1)"; [ -n "$f" ] && (mandoc -T utf8 "$f" 2>/dev/null || cat "$f") | col -b > "out/man-$m.txt"
          done

      - name: Probe (what metal-tt keeps)
        continue-on-error: true
        run: |
          mkdir -p out; exec > >(tee -a out/probe.txt) 2>&1
          bash a16/probe.sh

      - uses: actions/cache/restore@v4
        with:
          path: work/shader_cache_ios.noindex
          key: shaders-ios-none
          restore-keys: shaders-ios-

      - name: Generate and translate
        env:
          A16_LIMIT: ${{ inputs.limit }}
        run: |
          mkdir -p out; exec > >(tee -a out/lab.txt) 2>&1
          C=work/shader_cache_ios.noindex
          ls "$C" | head; ls "$C" | wc -l
          python3 a16/gen.py "$C" "$C/pipelines.all.tsv" a16/metal-enums.json lab.mtlp-json
          head -c 3000 lab.mtlp-json; echo
          head -c 20000 lab.mtlp-json > out/lab-head.mtlp-json
          date
          perl -e 'alarm shift; exec @ARGV' 4800 xcrun -sdk iphoneos metal-tt -target air64-apple-ios26.0 lab.mtlp-json -o lab.metalar
          date
          xcrun metal-lipo -archs lab.metalar
          xcrun metal-lipo -thin applegpu_g15p -output lab-a16.metalar lab.metalar
          ls -lh lab.metalar lab-a16.metalar
          rm -rf src; xcrun metal-source -flatbuffers=json lab-a16.metalar -o src && du -sh src/* && find src -type f | sed 's|/[^/]*$||' | sort | uniq -c
          xcrun metal-strip -help 2>&1 | head -20 || true
          rm -f lab.metalar lab-a16.metalar

      - name: Publish logs
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/publish-logs.sh lab
